[package]
name = "rejections"
version = "0.0.0"
edition = "2024"
publish = false
description = "trame's compile-time rejection suite: each case is one example (cases/<rule>/<name>.rs), run by run.sh (rejections/README.md)"
# Examples only, one per case file; the list is generated by run.sh between the markers below.
autoexamples = false
# Own workspace, like driver/: the suite is not a member of the trame root.
[workspace]

[dependencies]
# The real crate, with the seq backend (the default backend; spec.md 6).
trame = { path = "..", default-features = false, features = ["seq"] }

# BEGIN generated examples (rejections/run.sh rewrites this block from cases/)

