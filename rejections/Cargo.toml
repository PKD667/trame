[package]
name = "rejections"
version = "0.0.0"
edition = "2024"
description = "trame's compile-time rejection suite: each case is a file under cases/, judged by the trame driver (README.md)"
publish = false
# Own workspace, like driver/: the suite is not a member of the trame root.
[workspace]

# The dependencies of the cases. `cargo test` builds the cases' dependencies from this manifest, with the
# driver as the compiler (tests/ui.rs). The library is empty: it exists so that cargo builds this manifest.
[dependencies]
# The real crate, with the seq backend (the default backend; spec.md 6).
trame = { path = "..", default-features = false, features = ["seq"] }

[dev-dependencies]
# The harness: compiletest's engine (diagnostics as annotations, `//~ ERROR`), by Oli Obk.
ui_test = "0.30.7"

[[test]]
name = "ui"
path = "tests/ui.rs"
# ui_test runs its own main: it is the test, not a libtest harness.
harness = false
