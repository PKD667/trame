[package]
name = "trame-simd-experiment"
version = "0.0.0"
edition = "2024"
description = "Prototype: parallel! (INTERFACE.md 5.4) lowered to explicit AVX2 for hand-written lane versions of three item shapes. Not part of trame."
publish = false

[dependencies]
# The root crate refuses a build with no backend (build.rs). The bench calls only trame::__rt::parallel, the scalar
# reference, which does not depend on the backend; some backend is chosen for that compile alone, on the command line
# (`--features trame/<backend>`, as experiment.nix does), so this manifest names none.
trame = { path = "../..", default-features = false }

# Its own workspace root: the experiment is not a member of trame's workspace.
[workspace]

# The spec aborts on overflow in every build; the reference and the lanes are measured with it on.
[profile.release]
overflow-checks = true
debug = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trame_checked)'] }
