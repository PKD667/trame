path = "check/programs/refuse.rs"

[[example]]
name = "pool_edit"
path = "check/programs/pool_edit.rs"

[[example]]
name = "cells"
path = "check/programs/cells.rs"

# `trame_checked` is set by the driver (INTERFACE.md, Checked builds); it is not a feature.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trame_checked)'] }

# The spec aborts on overflow in every build, and the backends were measured with it on.
[profile.release]
overflow-checks = true

