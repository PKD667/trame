[package]
name = "trame"
version = "0.1.0"
edition = "2024"
description = "One meaning for a program on every machine it runs on; INTERFACE.md is the contract."

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
trame-macros = { path = "crates/macros" }
mpi = { version = "=0.8.2", optional = true }
libc = { version = "=0.2.191", optional = true }

# A backend is chosen at compile time, one per build, so every participant agrees by construction.
# The one place outside src/backends/ that names the backends: cargo declares features in the manifest, so each
# directory of src/backends/ with a backend.nix needs its feature here, of the same name (and its optional
# dependencies). Nothing else lists them: the flake, the lab and the scripts discover them from the directory.
# The features are exclusive and there is no default: every cargo command passes `--no-default-features --features
# <backend>`, and a build with none is a compile error (src/backends/mod.rs).
[features]
seq = []
mpi = ["dep:mpi", "dep:libc"]
# Keeps Cargo.lock whole for a program that names no backend: cargo locks only the dependencies some feature of the
# workspace reaches, so a program's own `lock = ["trame/lock"]` pulls in every backend's optional dependencies without
# selecting a backend. It is never built: with no backend a build is a compile error (src/backends/mod.rs). The union of
# the optional dependencies of the backends above; add a backend's here with its feature.
lock = ["dep:mpi", "dep:libc"]
# Lane sub-backends for parallel! (src/parallel/): at most one; none is the scalar fold, the reference. Not yet
# wired into parallel! (src/parallel/lane.rs). AVX2 (x86-64-v3) and AVX-512 (x86-64-v4: F, BW, DQ, VL).
lanes-avx2 = []
lanes-avx512 = []

# The MPI transport's own checks (src/backends/mpi/tests/run.sh), below the interface. Latency is measured by
# lab/bench/ping.rs, which is written against the interface and runs on every backend.
[[bin]]
name = "check"
path = "src/backends/mpi/tests/check.rs"
required-features = ["mpi"]

# Programs that run on every backend, with their expected stdout (check/programs/run.sh).
[[example]]
name = "ping_pong"
path = "check/programs/ping_pong.rs"

[[example]]
name = "leader_io"
path = "check/programs/leader_io.rs"

[[example]]
