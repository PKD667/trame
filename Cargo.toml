[package]
name = "trame"
version = "0.1.0"
edition = "2024"
description = "One meaning for a program on every machine it runs on; spec.md is the contract."

[lib]
path = "lib.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
trame-macros = { path = "macros" }
mpi = { version = "=0.8.2", optional = true }
libc = { version = "=0.2.191", optional = true }

# A backend is chosen at compile time, one per build, so every participant agrees by construction.
# `seq` and `mpi` are exclusive: lib.rs refuses a build that enables both.
[features]
default = ["seq"]
seq = []
mpi = ["dep:mpi", "dep:libc"]

# The MPI transport's checks and latency run (backends/mpi/tests/run.sh, backends/mpi/README.md).
[[bin]]
name = "check"
path = "backends/mpi/tests/check.rs"
required-features = ["mpi"]

[[bin]]
name = "latency"
path = "backends/mpi/tests/latency.rs"
required-features = ["mpi"]

# Programs that run on every backend, with their expected stdout (programs/run.sh).
[[example]]
name = "ping_pong"
path = "programs/ping_pong.rs"

[[example]]
name = "leader_io"
path = "programs/leader_io.rs"

[[example]]
name = "full"
path = "programs/full.rs"

[[example]]
name = "lossy"
path = "programs/lossy.rs"

[[example]]
name = "abort"
path = "programs/abort.rs"

[[example]]
name = "abort_join"
path = "programs/abort_join.rs"

[[example]]
name = "refuse"
path = "programs/refuse.rs"

[[example]]
name = "barrier_publish"
path = "programs/barrier_publish.rs"

[[example]]
name = "barrier_deadlock"
path = "programs/barrier_deadlock.rs"

[[example]]
name = "cells"
path = "programs/cells.rs"

# `trame_checked` is set by the driver (spec.md, Checked builds); it is not a feature.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trame_checked)'] }

# The spec aborts on overflow in every build, and the MPI transport was measured with it on.
[profile.release]
overflow-checks = true

[workspace]
members = ["macros"]

[[example]]
name = "wait_until"
path = "programs/wait_until.rs"

[[example]]
name = "join_deadline"
path = "programs/join_deadline.rs"

