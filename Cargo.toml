[package]
name = "trame"
version = "0.1.0"
edition = "2024"
description = "One meaning for a program on every machine it runs on; INTERFACE.md is the contract."

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
trame-macros = { path = "crates/macros" }
mpi = { version = "=0.8.2", optional = true }
libc = { version = "=0.2.191", optional = true }

# A backend is chosen at compile time, one per build, so every participant agrees by construction.
# `seq` and `mpi` are exclusive: lib.rs refuses a build that enables both.
[features]
default = ["seq"]
seq = []
mpi = ["dep:mpi", "dep:libc"]

# The MPI transport's checks and latency run (src/backends/mpi/tests/run.sh, src/backends/mpi/README.md).
[[bin]]
name = "check"
path = "src/backends/mpi/tests/check.rs"
required-features = ["mpi"]

[[bin]]
name = "latency"
path = "src/backends/mpi/tests/latency.rs"
required-features = ["mpi"]

# Programs that run on every backend, with their expected stdout (check/programs/run.sh).
[[example]]
name = "ping_pong"
path = "check/programs/ping_pong.rs"

[[example]]
name = "leader_io"
path = "check/programs/leader_io.rs"

[[example]]
name = "full"
path = "check/programs/full.rs"

[[example]]
name = "lossy"
path = "check/programs/lossy.rs"

[[example]]
name = "abort"
path = "check/programs/abort.rs"

[[example]]
name = "abort_join"
path = "check/programs/abort_join.rs"

[[example]]
name = "refuse"
path = "check/programs/refuse.rs"

[[example]]
name = "pool_edit"
path = "check/programs/pool_edit.rs"

[[example]]
name = "cells"
path = "check/programs/cells.rs"

# `trame_checked` is set by the driver (INTERFACE.md, Checked builds); it is not a feature.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trame_checked)'] }

# The spec aborts on overflow in every build, and the MPI transport was measured with it on.
[profile.release]
overflow-checks = true

[workspace]
members = ["crates/macros"]

