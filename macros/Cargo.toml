[package]
name = "trame-macros"
version = "0.1.0"
edition = "2024"
description = "#[parallel] and #[ordered]: a function rewritten into the driver trame::invoke! calls."

# A compiler plugin, not a library: nothing links this at run time, and the only crate that
# re-exports it is the backend. It depends on nothing, not even `syn`: the supported grammar is
# small enough to scan directly, which keeps the accepted language honest — what this file can
# parse is exactly what the surface promises.
[lib]
name = "trame_macros"
path = "lib.rs"
proc-macro = true

[dependencies]
