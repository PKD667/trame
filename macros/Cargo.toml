[package]
name = "trame-macros"
version = "0.1.0"
edition = "2024"
description = "#[message], #[item] and parallel!: the attributes and macro that write trame's surface code."

# A proc-macro crate. Its accepted grammar is the surface in lib.rs and spec.md 5.4.
[lib]
name = "trame_macros"
path = "lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
