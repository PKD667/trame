[package]
name = "trame-verify"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cargo-trame"
path = "src/main.rs"

[workspace]

[dependencies]
cargo_metadata = "0.18"
codespan-reporting = "0.11"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
